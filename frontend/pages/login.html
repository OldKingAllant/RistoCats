<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 0;
            background-color: #f1dfbb;
        }
        
        img {
            width: 500px;
            height: 500px;
            margin-bottom: 30px;
            margin-top: -100px;
        }
        
        .bottom_container {
            display: flex;
            flex-direction: row;
            align-items: space-between;
            justify-content: center;
            margin-top: 50px;
            height: 15%;
        }
        .bottom_container .button {
            padding: 35px 120px;
            font-size: 70px;
            font-family: 'Times New Roman', Times, serif;            
            background-color: #c50d0d;
            color: white;
            border: none;
            cursor: text;
            border-radius: 20px;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .bottom_container .textarea {
            padding: 10px 20px;
            font-size: 70px;
            font-family: 'Times New Roman', Times, serif;            
            background-color: white;
            color: black;
            border: none;
            cursor: pointer;
            border-radius: 20px;
            width: 20%;
            align-items: center;            
        }
    </style>
</head>
<body>
    <script>
        /**
         * Redirects to generated login url
        */
        function handle_response(resp) {
            if(resp.status != 200) {
                alert('An unexpected error has occurred, try again');
            } else {
                resp.json()
                    .then((body) => {
                        console.log(JSON.stringify(body));
                        window.location = body.url;
                    })
                    .catch((err) => {
                        console.log(`Error requesting login URL: ${err}`);
                        alert('An unexpected error has occurred, try again');
                    });
            }
        }

        /**
         * Requests server-side generated login url
         * and sets table id in local storage (even if not used)
        */
        function request_login_url() {
            let id_number = document.getElementById('id_number').value;
            window.localStorage.setItem('table_id', id_number);
            fetch('/api/users/loginurl', {
                method: 'GET'
            })
            .then(handle_response)
            .catch((err) => {
                console.log(`Error requesting login URL: ${err}`);
                alert('An unexpected error has occurred, try again');
            })
        }


    </script>
    <img src="../assets/images/ristotrositras.png" alt="Logo">
    <div class="bottom_container">
        <button class="button" onclick="request_login_url()">Login</button>
        <input type="number" class="textarea" id="id_number"></textarea>
    </div>
</body>
</html>
