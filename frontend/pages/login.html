<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 0;
            background-color: #f1dfbb;
        }
        
        img {
            width: 500px;
            height: 500px;
            margin-bottom: 30px;
            margin-top: -100px;
        }
        
        button {
            padding: 35px 120px;
            font-size: 50px;
            font-family: 'Times New Roman', Times, serif;            
            background-color: #c50d0d;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <script>
        function handle_response(resp) {
            if(resp.status != 200) {
                alert('An unexpected error has occurred, try again');
            } else {
                resp.json()
                    .then((body) => {
                        console.log(JSON.stringify(body));
                        window.location = body.url;
                    })
                    .catch((err) => {
                        console.log(`Error requesting login URL: ${err}`);
                        alert('An unexpected error has occurred, try again');
                    });
            }
        }

        function request_login_url() {
            fetch('/users/loginurl', {
                method: 'GET'
            })
            .then(handle_response)
            .catch((err) => {
                console.log(`Error requesting login URL: ${err}`);
                alert('An unexpected error has occurred, try again');
            })
        }
    </script>
    <img src="../assets/images/ristotrositras.png" alt="Logo">
    <button type="submit" onclick="request_login_url()">Login</button>
</body>
</html>
