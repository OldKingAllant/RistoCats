<!DOCTYPE html>
<html>
<head>
    <title>Customerview</title>
    <style>
        
        .type_ofdish{                                                 
            margin-top: 20px;
            text-align: center;
            font-size: 160px;
            margin-bottom: 20px;  
            color: #c50d0d;   
            align-items: center;    
            flex-direction: row;   
            margin-left: 0px;                           
            margin-right: 0px;
            margin-bottom: 40px;
            width: 75%;
            border-bottom: 2px solid #c50d0d;
            flex-direction: row;
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        .switch_button{                             
            justify-self: right;
            align-self: right;
            margin-left: 0px;
            margin-right: 0;
            justify-content: right;
            flex-direction: row;
            top: 0px;
            right: 80px;
            height: 150px; 
            width: 150px; 
            border-radius: 50px;
            background-color: transparent;
            border-width: 0px;
        }

        .text_box {
            position: absolute;
            top: 40px;
            right: 60px;
            color: #f1dfbb;
            font-size: 50px;
            font-family: "Times New Roman", Times, serif;
        }

        .red_band {
            background-color: #c50d0d;
            width: 30%; 
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .button {
            color: #f1dfbb;
            font-family: "Times New Roman", Times, serif;
            margin-bottom: 10px;
            background-color: #c50d0d;
            height: 120px; 
            width: 450px; 
            font-size: 50px;
            border-radius: 5px;     
            border-color: #f1dfbb; 
        }
        .button_total {
            color: #f1dfbb;
            font-family: "Times New Roman", Times, serif;
            margin-bottom: 20px;
            background-color: #c50d0d;
            height: 120px; 
            width: 400px; 
            font-size: 50px;
            border-radius: 5px;     
            border-color: #f1dfbb; 
            position: fixed;
            bottom: 0;
        }
        .logout_button{
            position: absolute;
            top: 100px;
            right: 100px;
            color: #f1dfbb;
            font-size: 35px;
            background-color: #c50d0d;
            border-color: #f1dfbb; 
            font-family: "Times New Roman", Times, serif;
            border-radius: 5px; 
        }
        img {
            position: absolute;
            top: 20px;
            left: 40px;
            width: 150px;
            height: 150px;
            background-color: #f1dfbb;
            border-radius: 80px;
        }

        .white_band {
            background-color: #f1dfbb;
            width: 70%; 
            height: 100vh;
            position: fixed;
            top: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            justify-content: top;
            align-items: center;
            overflow: auto;
        }

        .white_band::-webkit-scrollbar {
        width: 10px; 
        background: #f1dfbb;
        }

        .white_band::-webkit-scrollbar-thumb {
        background: #c50d0d; 
        border-radius: 5px; 
        }
        
        .order_button {
            flex-direction: column  ;
            font-size: 120px;
            justify-content: flex-end;
            position: relative;
            color: #f1dfbb;
            font-family: "Times New Roman", Times, serif;
            background-color: #c50d0d;
            align-items: center;
            align-self: center;
            align-content: center;
            height: 200px; 
            width: 450px;
            border-radius: 50px;     
            border-color: #f1dfbb;
            flex-shrink: 0; 
            margin-bottom: 30px;
        }
        
        .template {
            display: flex;
            flex-direction: unset;
            align-items: unset; 
            width: 1200px; 
            height: 600px; 
            margin-bottom: 100px;
            margin-top: 20px;
            flex-shrink: 0;
            flex-wrap: wrap;
            justify-content:left;
        }

        .template .popup{
            display: none;
            align-self: center;
            flex-direction: column;
            width: 60%;
            height: 60%;
            background-color: #c50d0d;
            z-index: 1;
        }

        .template .title {
            margin-top: 10px;
            text-align: center;
            font-size: 100px;
            margin-bottom: 0px;  
            color: #c50d0d;   
            align-items: center;    
            flex-direction: column;   
            margin-left: auto;
            margin-right: auto;
            width: 80%; 
        }
        .template .text {
            position: static;
            font-size: 30px;
            font-family: "Times New Roman", Times, serif;
            width: 460px;
            height: 300px;
            flex-wrap: nowrap;
            align-self: left;
            align-items: left;
            margin-left: 0px;
            margin-right: 10px;
            margin-bottom: 0px;
            margin-top: 10px;
        }
        
        .template .left-image {
            flex-basis: 60%;
            position: relative;
            width: 500px;
            height: auto;
            border-radius: 0px;
            margin-top: 0px;
            margin-left: 0px;
            align-items: flex-start;
            margin-right: 0px;
        }

        
        
        .remover, .adder, .counter, .nutritional_info, .lang_list_closer {
            font-size: 40px;
            font-family: 'Times New Roman', Times, serif;            
            background-color: #c50d0d;
            color:#f1dfbb;
            border-radius: 20px;
            width: 200px;
            height: 80px;
            margin-top: 50px;
            flex-direction: row;
            align-items: flex-end;
            border-color: #f1dfbb;
        }

        .remover {
            margin-left: 270px;
            bottom:20px;
        }

        .adder {
            margin-left: 5px;
            top: 100px;
        }
        
        .counter{
            font-size: 50px;
            background-color: white;
            color: black;
            margin-left: 5px;
            width: 80px;
            height: 80px;
            flex-direction: row;
            bottom: 50px;            
        }

        .nutritional_info {
            margin-left: 35px;
            bottom: 20px;
            width: 400px;
        }

        .total{
            display: flex;
            flex-direction: row;
            align-items: unset; 
            width: 1200px; 
            height: unset; 
            margin-bottom: 100px;
            margin-top: 280px;
            flex-shrink: 0;
            flex-wrap: wrap;
            justify-content:left;
        }

        .total .recap_title {
            margin-top: 50px;
            text-align: center;
            font-size: 150px;
            margin-bottom: 0px;  
            color: #c50d0d;   
            align-items: center;    
            flex-direction: column;   
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 40px;
            width: 80%;
            border-bottom: 2px solid #c50d0d;
        }

        .total .records_name, .notes, .quantity, .price {
            font-size: 60px;
            font-family: "Times New Roman", Times, serif;
            color: #c50d0d;;
            height: unset;
            flex-wrap: nowrap;
            align-self: unset   ;
            align-items: flex-end;
            flex-direction: row;
            
        }

        .total .records_name{
            position: static;
            font-size: 60px;
            font-family: "Times New Roman", Times, serif;
            color: #c50d0d;
            width: 650px;
            height: 70px;
            flex-wrap: nowrap;
            align-self: left   ;
            align-items: left;
            margin-left: 20px;
            margin-right: 25px;
            margin-bottom: 50px;
            margin-top: 0px;
        }

        .total .quantity{
            height: 70px;
            width: 70px;
            margin-left: 25px;
            margin-right: 25px;
            justify-content: center;
        }

        .total .price {
            height: 70px;
            width: 200px;
            margin-left: 25px;
            margin-right: 25px;
            justify-content: center;
        }

        .total .notes{
            background-color: #c50d0d;
            background-image: url('../assets/images/note_120060.png');
            background-repeat: no-repeat;
            background-size: cover;
            width: 70px;
            height: 70px;
            margin-left: 25px;
            border: 1px solid #f1dfbb;
        }

        .modalnotes {
            display: none;
            position: fixed;
            z-index: 1;
            margin-top: 180px;
            margin-left: 0px;
            overflow: auto;
            width: 1000px;
            height: 600px;
            background-color: #c50d0d;
            border: 2px solid #f1dfbb;
        }

            .modalnotes-content {
            background-color: #f1dfbb;
            width: 850px;
            height: 450px;
            opacity: 90%;
            margin-left: auto;
            margin-right: auto;
            margin-top: 60px;
            margin-bottom: auto;
        }

            .close {
                position: fixed;
                justify-self: center;
                bottom: 200px;
                left: 1220px;
                padding: 10px 10px;
                transform: translateX(-50%);
                font-size: 40px;
                background-color: #129401;
                color: #f1dfbb;
                border-radius: 5px;
                border: 1px solid #f1dfbb;
                cursor: pointer;
            }
        
        .userInput {
            width: 850px;
            height: 450px;
            background-color: #f1dfbb;
            font-family: "Times New Roman", Times, serif;
            font-size: 35px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            margin-top: 180px;
            margin-left: 0px;
            overflow: auto;
            width: 1000px;
            height: 600px;
            background-color: #c50d0d;
            border: 2px solid #f1dfbb;
        }

        .lang_select_list {
            display: none;
            position: fixed;
            z-index: 1;
            margin-top: 180px;
            margin-left: 0px;
            overflow: auto;
            width: 1000px;
            height: 600px;
            background-color: #cfb683d7;
            border: 2px solid #f1dfbb;
            align-self: center;
            border-radius: 25px;
        }

        .modal-contenuto {
                background-color: #fefefe;
                margin: auto;
                margin-top: 25px;
                height: 90%;
                border: 1px solid #888;
                width: 80%;
        }

            .closing {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            margin-right: 10px;
            }

            .closing:hover,
            .closing:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
            }
                    
    </style>
</head> 
<body> 
    <script defer src="../scripts/basic_behaviour.js"></script> 
    <script defer src="../scripts/common.js"></script>
   
    <div class="white_band">

          <div id="popup" class="modalnotes">
            <div class="modalnotes-content">
                <span class="close">submit</span>
                <textarea class="userInput"></textarea>
              
              <p id="modalText"></p>
            </div>
          </div>

          <div id="nutritionaltable" class="modal">
            <span class="closing">&times;</span>
            <div class="modal-contenuto" id="table_content"></div>
          </div>


        <div class="type_ofdish" id="appetizers">Appetizers</div>
            <button class="switch_button" onclick="change_lang()">
                <img id="lang_img" src="../assets/images/en_flag.png" alt="Flag">
            </button>
        <div id="appetizers_container"></div>

        <div class="type_ofdish" id="maindish">Main Course</div>
        <div id="maindish_container"></div>

        <div class="type_ofdish" id="secondcourse">Second Course</div>
        <div id="secondcourse_container"></div>
        <br>
        <br>
        <br>

        <div class="type_ofdish" id="dessert">Dessert</div>
        <div id="dessert_container"></div>
        <br>
        <br>
        
        <div class="total" id="sunto">
            <div class="recap_title">Total</div>
            <div class="records_name">Pasta e Fasoi</div>
            <div class="quantity">1</div>
            <div class="price">10.00$</div>
            <button class="notes" onclick="generatepopup('popup', 'close')"></button>

            <div class="records_name">Risi e Bisi</div>
            <div class="quantity">2</div>
            <div class="price">15.00$</div>
            <button class="notes" onclick="generatepopup('popup')"></button>
        </div>
        <button class="order_button" onclick="funzioneDiAlberto">Order</button>
    </div>
    <script src="../scripts/basic_behaviour.js"></script>
    
    <div class="red_band">
        <div> <img src="../assets/images/ristotrositras.png" alt="Logo"> </div>
        <button class="button" onclick="indexto('appetizers')">Appetizers</button>
        <button class="button" onclick="indexto('maindish')">Main Course</button>
        <button class="button" onclick="indexto('secondcourse')">Second Course</button>
        <button class="button" onclick="indexto('dessert')">Dessert</button>
        <button class="button_total" onclick="indexto('sunto')">Total</button>
        <button class="logout_button" onclick="perform_logout()">Logout</button>
        <div class="text_box"> Welcome! </div>
    </div>

</body>
</html>
